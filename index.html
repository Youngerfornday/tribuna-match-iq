<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tribuna Match IQ</title>
<meta name="description" content="Tribuna Match IQ prototype: make three calls on a match, compare them with CaptainAI, fans and the market, then track your Match IQ.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0f0c'/%3E%3Cpath d='M18 4 7 18h8l-1 10 11-14h-8z' fill='%23d7ff3d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  color-scheme:dark;
  --bg:#0e0f0c;
  --surface:#171915;
  --surface-2:#1f221c;
  --surface-3:#272b24;
  --line:#2c3128;
  --line-strong:#3a4035;
  --ink:#f3f4ec;
  --ink-2:#b4b8aa;
  --ink-3:#878c80;
  --accent:#d7ff3d;
  --accent-ink:#0e0f0c;
  --accent-dim:rgba(215,255,61,.14);
  --ai:#3987e5;
  --fans:#d95926;
  --market:#199e70;
  --danger:#e66767;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,system-ui,sans-serif;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 12px 32px -12px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.5);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1;letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}

/* --------------------------------------------------------------- site mock */
.site-head{
  position:sticky;top:0;z-index:20;background:rgba(14,15,12,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.site-head .row{max-width:560px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.wordmark{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px}
.wordmark i{width:10px;height:10px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
.site-nav{display:flex;gap:14px;font-size:13px;color:var(--ink-2);margin-left:auto;font-weight:500}
.site-nav span{opacity:.9}
.site-nav .on{color:var(--ink);border-bottom:2px solid var(--accent);padding-bottom:2px}
.page{max-width:560px;margin:0 auto;padding:20px 20px 40px;min-height:70vh}
.site-foot{max-width:560px;margin:0 auto;padding:16px 20px 40px;color:var(--ink-3);font-size:12px;line-height:1.5;border-top:1px solid var(--line)}
.site-foot .rg{display:flex;gap:10px;align-items:flex-start}
.badge18{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1.5px solid var(--ink-3);border-radius:50%;font-weight:700;font-size:11px;flex:none;color:var(--ink-2)}

/* -------------------------------------------------------------- primitives */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 20px;border-radius:var(--radius-sm);
  font-weight:600;font-size:16px;transition:transform .15s var(--ease),background .15s,color .15s,box-shadow .15s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px -8px rgba(0,0,0,.7)}
.btn-primary:hover{background:#e4ff6b}
.btn-secondary{background:var(--surface-3);color:var(--ink);border:1px solid var(--line-strong)}
.btn-secondary:hover{background:#2f342b}
.btn-ghost{color:var(--ink-2);min-height:44px;padding:0 10px}
.btn-ghost:hover{color:var(--ink)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.chip-accent{background:var(--accent-dim);border-color:transparent;color:var(--accent)}
.chip-warn{background:rgba(230,103,103,.14);border-color:transparent;color:#ff9b9b}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.stack>*+*{margin-top:14px}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:16px 0}
.swatch{width:10px;height:10px;border-radius:3px;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:500}
.legend .row{gap:6px}

/* --------------------------------------------------------------- match page */
.match-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.match-card .comp{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:14px 0 10px}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.crest{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px;color:#fff;letter-spacing:.02em;border:2px solid rgba(255,255,255,.08)}
.team b{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.05}
.kick{font-family:var(--font-display);font-size:34px;font-weight:800;line-height:1;color:var(--ink);letter-spacing:.02em}
.kick small{display:block;font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.countdown{font-variant-numeric:tabular-nums}
.venue{font-size:13px;color:var(--ink-3);text-align:center}
.preview h2{font-size:30px;margin:26px 0 8px;line-height:1.02}
.preview p{color:var(--ink-2);font-size:16px;line-height:1.6;max-width:62ch}
.preview p+p{margin-top:10px}
.byline{font-size:12px;color:var(--ink-3);margin-top:8px}
.widget{
  margin:22px 0;border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1c2116 0%,#171915 60%);border:1px solid var(--line-strong);box-shadow:var(--shadow);
}
.widget:before{content:"";position:absolute;inset:-40% -30% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,rgba(215,255,61,.16),transparent 70%);pointer-events:none}
.widget h2{font-size:34px;line-height:.98;max-width:12ch}
.widget h2 em{font-style:normal;color:var(--accent)}
.widget p{color:var(--ink-2);margin-top:10px;max-width:40ch}
.widget .facts{display:flex;gap:14px;margin:14px 0 18px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.widget .facts .row{gap:6px}
.club-pick{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.club-pick .row{gap:8px;margin-top:8px}
.club-btn{flex:1;min-height:44px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface-2);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.club-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-dim)}
.club-btn .dot{width:12px;height:12px;border-radius:50%;flex:none}
.odds-plain{margin-top:8px}
.odds-plain .head{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.odds-plain .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.odds-plain .cell{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;text-align:center}
.odds-plain .cell span{display:block;font-size:12px;color:var(--ink-3)}
.odds-plain .cell b{font-family:var(--font-display);font-size:20px}

/* ------------------------------------------------------------ challenge shell */
.shell-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.steps{display:flex;gap:6px;flex:1;max-width:220px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line-strong)}
.steps i.done{background:var(--accent)}
.steps i.now{background:var(--accent);opacity:.55}
.q-title{font-size:40px;line-height:.95;margin:6px 0 4px}
.q-sub{color:var(--ink-2);font-size:15px}
.options{display:grid;gap:10px;margin-top:18px}
.opt{
  display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
  min-height:60px;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--line-strong);
  background:var(--surface);transition:border-color .15s,background .15s,transform .15s var(--ease);
}
.opt:hover{border-color:#4b5245;background:var(--surface-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-dim)}
.opt[disabled]{cursor:default;transform:none}
.opt[disabled]:hover{border-color:var(--line-strong);background:var(--surface)}
.opt[disabled][aria-pressed="true"]{border-color:var(--accent);background:var(--accent-dim)}
.opt .lbl{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1}
.opt .sub{font-size:13px;color:var(--ink-3);margin-top:3px;font-family:var(--font-body);font-weight:400}
.opt .tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* reveal (grouped bar chart) */
.reveal{margin-top:18px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.reveal h3{font-size:20px;font-weight:700}
.reveal .legend{margin:8px 0 14px}
.grp{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0}
.grp .name{font-weight:600;font-size:14px;line-height:1.2}
.grp .name .you{display:block;font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bars{display:grid;gap:2px}
.bar{display:grid;grid-template-columns:1fr 34px;align-items:center;gap:8px;height:12px}
.bar .track{height:10px;position:relative}
.bar .fill{height:10px;border-radius:0 4px 4px 0;transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease)}
.fill.in{transform:scaleX(1)}
.bar .val{font-size:12px;color:var(--ink-2);text-align:right}
.grp.you .name{color:var(--ink)}
.reason{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.ai-dot{width:22px;height:22px;border-radius:6px;background:rgba(57,135,229,.18);color:#8db9f2;display:grid;place-items:center;flex:none;margin-top:1px}
.back{transform:rotate(180deg)}
.reason a{white-space:nowrap}
.foot-cta{margin-top:18px;display:flex;gap:10px;flex-direction:column}

/* power pick, lock */
.pick-list{display:grid;gap:10px;margin-top:18px}
.pick{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--line-strong);background:var(--surface);text-align:left;min-height:64px;transition:border-color .15s,background .15s}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-dim)}
.pick .k{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pick .v{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.05}
.pick .x2{margin-left:auto;font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--ink-3)}
.pick[aria-pressed="true"] .x2{color:var(--accent)}
.slip{margin-top:18px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.slip .hd{padding:12px 16px;background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between}
.slip .leg{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.slip .leg .n{width:22px;height:22px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2);flex:none}
.slip .leg .t{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1}
.slip .leg .s{font-size:12px;color:var(--ink-3)}
.slip .leg.pp{background:var(--accent-dim)}
.slip .leg.pp .n{background:var(--accent);color:var(--accent-ink)}
.slip .leg .pp-tag{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:4px}
.lockstamp{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line);color:var(--accent);font-weight:600}
.locked-anim{animation:stamp .6s var(--ease) both}
@keyframes stamp{0%{transform:scale(1.06);opacity:0}60%{transform:scale(.98);opacity:1}100%{transform:none}}

/* odds */
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:10px;margin-top:16px}
.tab{flex:1;min-height:40px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2);transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--surface-3);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.odds-table{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.odds-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);background:var(--surface)}
.odds-row:first-child{border-top:0}
.odds-row.best{background:linear-gradient(90deg,var(--accent-dim),transparent 60%)}
.odds-row .bk{font-weight:600}
.odds-row .bk small{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.odds-row .o{font-family:var(--font-display);font-size:26px;font-weight:800;text-align:right;line-height:1}
.odds-row .o small{display:block;font-family:var(--font-body);font-size:12px;color:var(--ink-3);font-weight:500;margin-top:2px}
.odds-row .go{min-height:40px;padding:0 14px;font-size:14px}
.call{margin-top:14px;padding:14px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.call .hd{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ink-3)}
.call .big{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:4px;line-height:1.05}
.call .cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.call .cmp div{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px;text-align:center}
.call .cmp span{display:block;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.call .cmp b{font-family:var(--font-display);font-size:24px;font-weight:800}
.call .note{font-size:13px;color:var(--ink-2);margin-top:10px}
.rg{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--ink-3);margin-top:14px;line-height:1.45}

/* waiting */
.wait{margin-top:18px;text-align:center;padding:28px 18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.wait .big{font-family:var(--font-display);font-size:52px;font-weight:800;line-height:1;letter-spacing:.02em}
.wait .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-top:8px}
.proto{margin-top:24px;padding:14px;border:1px dashed var(--line-strong);border-radius:var(--radius);text-align:center;color:var(--ink-3);font-size:13px}
.proto .btn{margin-top:10px}

/* result */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:16px;padding:18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.score .t{font-family:var(--font-display);font-size:22px;font-weight:700;text-align:center}
.score .s{font-family:var(--font-display);font-size:44px;font-weight:800;letter-spacing:.04em}
.score .ft{grid-column:1/-1;text-align:center;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.calls{margin-top:14px;display:grid;gap:8px}
.callrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line)}
.callrow .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.callrow .ic.ok{background:var(--accent);color:var(--accent-ink)}
.callrow .ic.no{background:rgba(230,103,103,.18);color:var(--danger)}
.callrow .t{font-weight:600}
.callrow .t small{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.callrow .pts{margin-left:auto;font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--ink-2)}
.callrow .pts.ok{color:var(--accent)}
.iq-hero{margin-top:16px;padding:20px;border-radius:var(--radius);background:linear-gradient(135deg,#1c2116,#171915 70%);border:1px solid var(--line-strong);display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
.iq-hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.iq-hero .n{font-family:var(--font-display);font-size:56px;font-weight:800;line-height:1;color:var(--accent)}
.iq-hero .n small{font-size:20px;color:var(--ink-2);font-weight:700;margin-left:4px}
.duel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.duel div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;text-align:center}
.duel span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.duel b{font-family:var(--font-display);font-size:28px;font-weight:800;line-height:1.1}
.duel div.win{border-color:var(--accent)}
.insight{margin-top:12px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}

/* retention */
.profile{margin-top:16px;padding:18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.profile .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.profile .rating{font-family:var(--font-display);font-size:48px;font-weight:800;line-height:1}
.profile .rating small{font-size:16px;color:var(--ink-3);font-weight:600;margin-left:6px;font-family:var(--font-body)}
.profile .league{text-align:right}
.profile .league b{font-family:var(--font-display);font-size:22px;font-weight:700;display:block}
.profile .league span{font-size:12px;color:var(--ink-3)}
.progress{margin-top:12px;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}

.lb table{width:100%;border-collapse:collapse;font-size:14px}

.lb table .name{display:flex;align-items:center;gap:8px;font-weight:500}

/* ================================================================= helpers */
const icon = (name, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#${name}"/></svg>`;
const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
const round2 = (n) => Math.round(n * 100) / 100;
const fmtOdds = (n) => n.toFixed(2);
const pts = (n) => `${n} ${n === 1 ? 'point' : 'points'}`;

function impliedProbs(question) {
  const raw = question.options.map((o) => 1 / avg(o.odds));
  if (!question.exclusive) return raw.map((r) => Math.round(r * 100));
  const overround = raw.reduce((a, b) => a + b, 0);
  return raw.map((r) => Math.round((r / overround) * 100));
}
function marketFor(question, optionId) {
  const probs = impliedProbs(question);
  const idx = question.options.findIndex((o) => o.id === optionId);
  return probs[idx];
}
function pickBy(question, key) {
  return question.options.reduce((best, o) => (o[key] > best[key] ? o : best), question.options[0]);
}
function marketPick(question) {
  const probs = impliedProbs(question);
  const idx = probs.indexOf(Math.max(...probs));
  return question.options[idx];
}
function leagueFor(iq) {
  return LEAGUES.reduce((cur, l) => (iq >= l.min ? l : cur), LEAGUES[0]);
}
function nextLeague(iq) {
  return LEAGUES.find((l) => l.min > iq) || null;
}
function hitRate(correct, total) {
  return total ? Math.round((correct / total) * 100) : 0;
}
function isCorrect(match, question, optionId) {
  const r = match.result;
  if (question.id === 'winner') {
    const outcome = r.homeGoals > r.awayGoals ? 'home' : r.homeGoals < r.awayGoals ? 'away' : 'draw';
    return optionId === outcome;
  }
  if (question.id === 'goals') return (r.homeGoals + r.awayGoals > 2.5) === (optionId === 'over');
  if (question.id === 'scorer') return r.scorers.includes(optionId);
  return false;
}
function optionOf(question, id) {
  return question.options.find((o) => o.id === id);
}
function pad(n) { return String(n).padStart(2, '0'); }
function formatCountdown(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
}

/* ============================================================= persistence */
const DEFAULT_PROFILE = Object.freeze({
  iq: 0, streak: 0, played: 0,
  correct: 0, total: 0, aiCorrect: 0, marketCorrect: 0,
  humans: 3, ai: 2, club: null,
});
function loadProfile() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...DEFAULT_PROFILE };
    const parsed = JSON.parse(raw);
    return { ...DEFAULT_PROFILE, ...parsed };
  } catch (e) {
    return { ...DEFAULT_PROFILE };
  }
}
function saveProfile(profile) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(profile)); } catch (e) { /* private mode: keep in memory */ }
}

/* =================================================================== state */

  matchIndex: 0,
  qIndex: 0,
  answers: {},
  powerPick: null,
  oddsTab: 'builder',
  lbTab: 'players',
  kickoff: Date.now() + KICKOFF_OFFSET_MS,
  outcome: null,
  profile: loadProfile(),
  events: [],
});
let state = initialState();

function setState(patch) {
  state = { ...state, ...patch };
  render();
}
function track(event, props = {}) {
  const entry = { event, props, ts: Date.now() };
  console.log('[MatchIQ]', event, props);
  state = { ...state, events: [...state.events, entry] };
  renderMetrics();
}
function updateProfile(patch) {
  const profile = { ...state.profile, ...patch };
  saveProfile(profile);
  return profile;
}

/* ================================================================== views */

function shellHead(step) {

  <div class="shell-head">
    <button class="btn btn-ghost" data-action="back-to-match" aria-label="Back to match page">${icon('i-arrow', 'back')}</button>

    </div>
    <span class="chip">${icon('i-clock')} <span class="countdown num" data-countdown>${formatCountdown(state.kickoff - Date.now())}</span></span>

function computeOutcome() {
  const m = currentMatch();
  const calls = m.questions.map((q) => {
    const o = optionOf(q, state.answers[q.id]);
    const ok = isCorrect(m, q, o.id);
    const pp = state.powerPick === q.id;
    const points = ok ? POINTS_PER_CALL * (pp ? POWER_PICK_MULTIPLIER : 1) : 0;
    const aiOk = isCorrect(m, q, pickBy(q, 'ai').id);
    const fansOk = isCorrect(m, q, pickBy(q, 'fans').id);
    const marketOk = isCorrect(m, q, marketPick(q).id);
    return { q, o, ok, pp, points, aiOk, fansOk, marketOk };
  });
  const you = calls.filter((c) => c.ok).length;
  const ai = calls.filter((c) => c.aiOk).length;
  const fans = calls.filter((c) => c.fansOk).length;
  const market = calls.filter((c) => c.marketOk).length;
  const points = calls.reduce((a, c) => a + c.points, 0);
  const badges = [];
  if (you === calls.length) badges.push({ id: 'perfect', label: 'Perfect Match: 3 of 3' });
  if (you > ai) badges.push({ id: 'beat-ai', label: 'Beat the AI' });
  if (calls.some((c) => c.ok && c.o.fans <= 30)) badges.push({ id: 'crowd', label: 'Against the Crowd' });
  return { calls, you, ai, fans, market, points, badges };
}

const VIEWS = { match: viewMatch, question: viewQuestion, power: viewPowerPick, lock: viewLock, odds: viewOdds, wait: viewWait, result: viewResult, retention: viewRetention };

function render() {
  const app = document.getElementById('app');
  app.innerHTML = VIEWS[state.screen]();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  requestAnimationFrame(() => {
    app.querySelectorAll('.fill[data-w]').forEach((el) => { el.style.width = el.dataset.w + '%'; el.classList.add('in'); });
    app.querySelectorAll('.progress i').forEach((el) => el.classList.add('in'));
    app.querySelectorAll('[data-countup]').forEach(countUp);
  });
  renderMetrics();
}

function countUp(el) {
  const target = Number(el.dataset.countup);
  const suffix = el.querySelector('small') ? el.querySelector('small').outerHTML : '';
  const start = performance.now();
  const dur = 900;
  const step = (t) => {
    const k = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    el.innerHTML = Math.round(target * eased) + suffix;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function renderMetrics() {
  const el = document.getElementById('metrics');
  const counts = FUNNEL.map(([ev]) => state.events.filter((e) => e.event === ev).length);
  const max = Math.max(1, ...counts);
  const open = el.querySelector('details') ? el.querySelector('details').open : false;
  const last = state.events.slice(-8).reverse();
  el.innerHTML = `
  <details ${open ? 'open' : ''}>
    <summary>${icon('i-chart')} Metrics panel · ${state.events.length} events this session ${icon('i-chev', 'chev')}</summary>
    <div class="body">
      <div class="funnel">
        ${FUNNEL.map(([ev, label], i) => `<div class="f"><span>${label}</span><div class="track"><div class="fill" style="width:${(counts[i] / max) * 100}%"></div></div><b class="num">${counts[i]}</b></div>`).join('')}
      </div>
      <p class="def">North Star: Weekly Betting-Intent Predictors = users with <b>prediction_locked</b> and <b>bookmaker_click</b> in the same week. Completion rate = locked / started. Return-to-result = result_viewed within 48h of lock.</p>
      <div class="evlog">${last.length ? last.map((e) => `${new Date(e.ts).toLocaleTimeString()} · ${e.event}${Object.keys(e.props).length ? ' ' + JSON.stringify(e.props) : ''}`).join('<br>') : 'No events yet.'}</div>
    </div>
  </details>`;
}

let toastTimer = null;
function toast(text, kind = '') {
  const wrap = document.getElementById('toasts');
  wrap.innerHTML = `<div class="toast ${kind}">${kind === 'badge' ? icon('i-trophy') : icon('i-check')}<span>${text}</span></div>`;

}
function toastQueue(items) {
  items.forEach((t, i) => setTimeout(() => toast(t.text, t.kind), i * 2800 + 400));
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
}

      aiCorrect: p.aiCorrect + outcome.ai,
      marketCorrect: p.marketCorrect + outcome.market,
      humans: p.humans + (outcome.you > outcome.ai ? 1 : 0),
      ai: p.ai + (outcome.ai > outcome.you ? 1 : 0),
    });
    track('result_viewed', { match: currentMatch().id, correct: outcome.you, points: outcome.points });
    setState({ outcome, profile, screen: 'result' });
    toastQueue(outcome.badges.map((b) => ({ text: `Badge unlocked: ${b.label}`, kind: 'badge' })));
  },
  'to-retention'() { setState({ screen: 'retention' }); },
  'lb-tab'(btn) { setState({ lbTab: btn.dataset.tab }); },
  'next-match'() {
    track('next_match_click', { from: currentMatch().id });
    setState({ matchIndex: (state.matchIndex + 1) % MATCHES.length, screen: 'match', answers: {}, powerPick: null, qIndex: 0, outcome: null, kickoff: Date.now() + KICKOFF_OFFSET_MS });
  },
  'read-more'() {
    track('content_click', { screen: state.screen });
    toast('Opens the full article on Tribuna (mock)');
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const handler = ACTIONS[el.dataset.action];
  if (!handler) return;
  if (el.tagName === 'A') e.preventDefault();
  handler(el);
});

setInterval(() => {
  const text = formatCountdown(state.kickoff - Date.now());
  document.querySelectorAll('[data-countdown]').forEach((el) => { el.textContent = text; });
}, 1000);

render();
</script>
</body>
</html>
